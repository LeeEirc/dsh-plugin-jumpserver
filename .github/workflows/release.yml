name: Build and Release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to rebuild (blank uses the selected branch package version)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Test and package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve package version
        id: version
        env:
          REQUESTED_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(version)) {
            throw new Error('package.json must contain a semantic version');
          }
          const tag = `v${version}`;
          if (process.env.REQUESTED_TAG && process.env.REQUESTED_TAG !== tag) {
            throw new Error(`Release tag must match package.json: expected ${tag}`);
          }
          const sha = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const prerelease = version.split('+')[0].includes('-');
          appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\nsha=${sha}\nprerelease=${prerelease}\n`);
          NODE

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run unit tests
        run: npm test

      - name: Build client
        run: npm run build

      - name: Package plugin
        run: |
          mkdir -p dist
          npm pack --ignore-scripts --pack-destination dist

      - name: Generate checksum
        working-directory: dist
        run: sha256sum -- *.tgz > SHA256SUMS

      - name: Save package artifact
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-package
          path: |
            dist/*.tgz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: true

  publish:
    name: Publish GitHub Release
    needs: build
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: publish-${{ needs.build.outputs.tag }}
      cancel-in-progress: false
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: dist
          merge-multiple: true

      - name: Verify package checksum
        working-directory: dist
        run: sha256sum --check SHA256SUMS

      - name: Create or update release assets
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          SOURCE_SHA: ${{ needs.build.outputs.sha }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readdirSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';
          const { GH_REPO: repo, RELEASE_TAG: tag, SOURCE_SHA: sha } = process.env;
          function gh(args, optional = false) {
            const result = spawnSync('gh', args, { encoding: 'utf8' });
            if (result.error) throw result.error;
            if (result.status !== 0) {
              if (optional && /HTTP 404|release not found/i.test(result.stderr)) return null;
              throw new Error(result.stderr.trim() || `gh exited with status ${result.status}`);
            }
            return result.stdout.trim();
          }
          const release = JSON.parse(gh(['release', 'view', tag, '--json', 'isDraft,targetCommitish,url'], true) || 'null');
          const ref = JSON.parse(gh(['api', `repos/${repo}/git/ref/tags/${encodeURIComponent(tag)}`], true) || 'null');
          if (ref) {
            let object = ref.object;
            for (let depth = 0; object.type === 'tag'; depth++) {
              if (depth >= 8) throw new Error('Too many nested annotated tags');
              object = JSON.parse(gh(['api', `repos/${repo}/git/tags/${object.sha}`])).object;
            }
            if (object.type !== 'commit' || object.sha !== sha) {
              throw new Error(`${tag} points to a different commit. Rebuild that tag, or bump package.json for a new release.`);
            }
          } else if (release && (!release.isDraft || release.targetCommitish !== sha)) {
            throw new Error('Existing release does not identify the requested source commit');
          }
          const packages = readdirSync('.').filter(name => name.endsWith('.tgz'));
          if (packages.length !== 1) throw new Error('Expected exactly one plugin package');
          if (!release) {
            const args = ['release', 'create', tag, '--target', sha, '--title', tag, '--generate-notes', '--draft'];
            if (process.env.PRERELEASE === 'true') args.push('--prerelease');
            gh(args);
          }
          gh(['release', 'upload', tag, ...packages, 'SHA256SUMS', '--clobber']);
          if (!release || release.isDraft) gh(['release', 'edit', tag, '--draft=false']);
          const url = gh(['release', 'view', tag, '--json', 'url', '--jq', '.url']);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Published [${tag}](${url})\n\nAssets: ${packages[0]}, SHA256SUMS\n`);
          NODE
